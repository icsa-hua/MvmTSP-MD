services: 
  mvmtsp-app: 
    build: . 
    image: dgeorgiadishua/glpk-python3:mvmtsp 

    volumes: 
     - ./:/workspace 
     - ./vps_env:/opt/venv 

    environment: 
     - VENV_PATH=/opt/venv


    ipc: host 
    shm_size: "1gb" 

    command: >
      bash -lc "
        set -e; 
        python3 -V; 
        glpsol --version; 

        if [ ! -x $$VENV_PATH/bin/python ]; then
          echo 'Creating venv in '$$VENV_PATH; 
          python3 -m venv $$VENV_PATH; 
        fi; 

        source $$VENV_PATH/bin/activate; 
        
        python3 -m pip install -e . 
      " 


volumes: 
  venv: 
